<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100" viewBox="0 0 1000 100">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="100" fill="url(#bgGrad)" rx="8"/>

  <!-- Minimal border -->
  <rect x="0.5" y="0.5" width="999" height="99" fill="none" stroke="url(#textGrad)" stroke-width="1" rx="8" opacity="0.4"/>

  <!-- Main text -->
  <text x="500" y="45" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="24" font-weight="500" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    Always Building — Always Learning
  </text>

  <!-- Subtle underline -->
  <rect x="400" y="58" width="200" height="1" rx="0.5" fill="url(#textGrad)" opacity="0.5"/>

  <!-- Tech stack -->
  <text x="500" y="78" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle" letter-spacing="4">
    REACT · TAILWIND · JAVASCRIPT · NODE.JS
  </text>
</svg>