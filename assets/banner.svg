<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1000 200">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <!-- Subtle background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12182a"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Scanline effect -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00F7FF" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    <!-- Clip for rounded corners -->
    <clipPath id="roundCorner">
      <rect width="1000" height="200" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundCorner)">
    <!-- Background -->
    <rect width="1000" height="200" fill="url(#bgGrad)"/>
    <rect width="1000" height="200" fill="url(#grid)"/>
    <rect width="1000" height="200" fill="url(#scanlines)"/>

    <!-- Decorative corner accents -->
    <path d="M 0 60 L 0 16 Q 0 0 16 0 L 60 0" fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.6"/>
    <path d="M 940 0 L 984 0 Q 1000 0 1000 16 L 1000 60" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.6"/>
    <path d="M 0 140 L 0 184 Q 0 200 16 200 L 60 200" fill="none" stroke="#9D4EDD" stroke-width="2" opacity="0.6"/>
    <path d="M 940 200 L 984 200 Q 1000 200 1000 184 L 1000 140" fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.6"/>

    <!-- Decorative floating dots -->
    <circle cx="120" cy="40" r="2" fill="#00F7FF" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="55" r="2" fill="#FF6B6B" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="160" r="1.5" fill="#9D4EDD" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="165" r="1.5" fill="#00F7FF" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Decorative line accents -->
    <line x1="40" y1="100" x2="140" y2="100" stroke="#00F7FF" stroke-width="1" opacity="0.2">
      <animate attributeName="x2" values="140;180;140" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="860" y1="100" x2="960" y2="100" stroke="#FF6B6B" stroke-width="1" opacity="0.2">
      <animate attributeName="x1" values="860;820;860" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Main name text with glow -->
    <text x="500" y="85" font-family="'Segoe UI', 'SF Pro', system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#mainGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="3">
      HASNAIN AMIR
    </text>

    <!-- Subtle underline -->
    <rect x="350" y="98" width="300" height="2" rx="1" fill="url(#mainGrad)" opacity="0.6">
      <animate attributeName="width" values="300;350;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="350;325;350" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Role text -->
    <text x="500" y="125" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="6" filter="url(#softGlow)">
      FULL STACK DEVELOPER
    </text>

    <!-- Tagline -->
    <text x="500" y="158" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#484f58" text-anchor="middle" letter-spacing="1">
      🚀 Building real-time web apps · Self-taught · Always curious
    </text>

    <!-- Animated scanner line -->
    <rect x="0" y="0" width="1000" height="1" fill="#00F7FF" opacity="0.15">
      <animate attributeName="y" values="0;200;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="998" height="198" fill="none" stroke="url(#mainGrad)" stroke-width="2" rx="19" opacity="0.5"/>
</svg>