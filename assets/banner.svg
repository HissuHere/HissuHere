<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 1000 120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="120" fill="url(#g2)" rx="16"/>
  <rect x="1" y="1" width="998" height="118" fill="none" stroke="url(#g1)" stroke-width="3" rx="15"/>
  <text x="500" y="62" font-family="Fira Code, monospace" font-size="34" font-weight="bold" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">🚀 Always Building — Always Learning</text>
  <text x="500" y="96" font-family="Fira Code, monospace" font-size="16" fill="#8b949e" text-anchor="middle">React · Tailwind · JavaScript · Node.js</text>
  <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
</svg>
